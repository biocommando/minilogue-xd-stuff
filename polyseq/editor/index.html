<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        /* AI generated slightly nicer styles than browser's defaults */
        /* Global Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #2b2b2f;
            /* Softer, lighter dark tone to prevent eye strain */
            color: #d1d1d6;
            /* Muted off-white text to lower harsh contrast */
            padding: 2.5rem;
            max-width: 1000px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Headings */
        h1 {
            font-size: 1.25rem;
            color: #ffffff;
            margin: 1.5rem 0 1rem 0;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Style the top MIDI Setup Box */
        #midiSetupDiv {
            background-color: #323236;
            /* Slightly lighter container layer */
            padding: 1.5rem;
            border-radius: 6px;
            border: 1px solid #3d3d42;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #bcbcc2;
        }

        /* Specific elements inside the Setup Box */
        #midiSetupDiv h1 {
            margin-top: 0;
            font-size: 1.15rem;
        }

        #midiSetupDiv select {
            margin: 0 0.75rem;
            width: auto;
            display: inline-block;
        }

        /* Dropdown Select Menus */
        select {
            background-color: #222225;
            /* Deeper contrast block for clarity */
            color: #e5e5ea;
            border: 1px solid #48484a;
            border-radius: 4px;
            padding: 0.55rem 0.85rem;
            font-size: 0.95rem;
            cursor: pointer;
        }

        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: #5e5ce6;
            /* Calm purple indicator */
        }

        /* Channel Dropdown (Directly in body) */
        #midi-channel {
            margin-bottom: 2rem;
            min-width: 120px;
        }

        /* General Text Inputs (Like the Semitones input box) */
        input[type="text"],
        input:not([type]) {
            background-color: #222225;
            color: #ffffff;
            border: 1px solid #48484a;
            border-radius: 4px;
            padding: 0.45rem 0.75rem;
            font-size: 0.95rem;
            width: 60px;
            /* Small layout width for numeric entry */
            text-align: center;
            margin-left: 0.5rem;
            margin-right: 1.5rem;
        }

        /* Checkbox Inputs */
        input[type="checkbox"] {
            accent-color: #5e5ce6;
            /* Matches the focus ring accent color */
            width: 1rem;
            height: 1rem;
            vertical-align: middle;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        /* JSON Code Editor Box */
        textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            background-color: #1c1c1e;
            /* Easy on the eyes for dense text reading */
            color: #d1d1d6;
            border: 1px solid #3a3a3c;
            border-radius: 6px;
            padding: 1rem;
            font-family: Monaco, Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            box-sizing: border-box;
        }

        /* Horizontal Divider */
        hr {
            border: 0;
            height: 1px;
            background-color: #3a3a3c;
            margin: 2rem 0;
        }

        /* System Buttons */
        button {
            background-color: #424248;
            color: #ffffff;
            border: 1px solid #48484a;
            border-radius: 4px;
            padding: 0.55rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        button:hover {
            background-color: #4c4c52;
        }

        /* Bottom Main Action Button */
        button[onclick="sendSequence()"] {
            background-color: #34c759;
            /* Softer, desaturated green */
            color: #121214;
            /* Dark text color for maximum visibility */
            border: none;
            font-weight: 600;
            /* Stronger font weight to make text pop */
            padding: 0.75rem 2rem;
            font-size: 0.95rem;
        }

        button[onclick="sendSequence()"]:hover {
            background-color: #30db5b;
        }

        pre {
            border: solid black 3px;
            padding: 12px;
        }
    </style>
    <title>PolySeq editor</title>
</head>

<body>
    <div id="midiSetupDiv">
        <h1>MIDI setup</h1>
        Output
        <select id="outputDeviceSelect"></select>
        Input
        <select id="inputDeviceSelect"></select>
        <button onclick="runMidiSetup()">Accept</button>
    </div>
    <div id="editorDiv" style="display: none;">
        <h1>MIDI channel</h1>

        <select id="midi-channel">
            <option value="0">1</option>
            <option value="1">2</option>
            <option value="2">3</option>
            <option value="3">4</option>
            <option value="4">5</option>
            <option value="5">6</option>
            <option value="6">7</option>
            <option value="7">8</option>
            <option value="8">9</option>
            <option value="9">10</option>
            <option value="10">11</option>
            <option value="11">12</option>
            <option value="12">13</option>
            <option value="13">14</option>
            <option value="14">15</option>
            <option value="15">16</option>
        </select>

        <h1>Transpone</h1>

        Transpone semitones <input value="0" id="offset-semis">

        <h1>JSON note listing</h1>
        <textarea id="json-notes" rows="20" cols="80"></textarea>
        <hr />
        <button onclick="sendSequence()">Send to device</button>
        <button onclick="printEvents()">Print CC event list</button>
        <pre id="ccEventListPre"></pre>
        <button onclick="ccEventListPre.innerText=''">Clear list</button>
        <button id="recButton" onclick="toggleRecording()">Record</button> Tempo (quantize last--first boundary to bar) <input value="120" id="qtztempo">
    </div>

    <script src="midi.js"></script>
    <script src="seq.js"></script>

    <script>
        const devices = new MidiDeviceList()
        async function init() {
            await devices.init()
            outputDeviceSelect.innerHTML =
                devices.getOutputs().map(x => `<option value="${x.id}">${x.name}</option>`).join('')
            inputDeviceSelect.innerHTML =
                devices.getInputs().map(x => `<option value="${x.id}">${x.name}</option>`).join('')
        }
        let outputDevice
        function runMidiSetup() {
            outputDevice = devices.getDevice('output', outputDeviceSelect.value)
            inputDevice = devices.getDevice('input', inputDeviceSelect.value)
            inputDevice.onNoteOn = (channel, note, velocity) => record('on', note)
            inputDevice.onNoteOff = (channel, note) => record('off', note)
            midiSetupDiv.style.display = 'none'
            editorDiv.style.display = ''
        }
        function convertSequence() {
            const sequence = JSON.parse(document.getElementById('json-notes').value)
            const semiOffset = Number(document.getElementById('offset-semis').value)
            const ccList = getFullSequence(sequence, semiOffset)
            return ccList.map(val => {
                return val
            })
        }
        async function sendSequence() {
            const sshapeCc = 104;
            const channel = Number(document.getElementById('midi-channel').value)
            const seq = convertSequence()
            console.log('sending events', seq.length)
            for (let i = 0; i < seq.length; i++) {
                outputDevice.cc(sshapeCc, seq[i], channel)
                if (i % 100 == 0)
                    console.log('sent ', i)
            }

            alert('sequence sent')
        }
        function printEvents() {
            ccEventListPre.innerText = convertSequence().join('\n')
        }

        let recording = false
        let recSequence = [], recTimeOffset
        function toggleRecording() {
            recording = !recording
            if (recording) {
                recButton.innerText = 'Stop recording'
                recSequence = []
            } else {
                recButton.innerText = 'Record'
                if (recSequence.length > 0) {
                        const samplesPerQuarterNote = 48000 * 60 / Number(qtztempo.value)
                        const fullBarSamples = samplesPerQuarterNote * 4
                        const totalSeqSamples = recSequence.reduce((a, b) => a + b.delta, 0)
                        const fullBars = Math.floor(totalSeqSamples / fullBarSamples)
                        const quantizedDeltaToStart = fullBarSamples - (totalSeqSamples - fullBars * fullBarSamples)
                        recSequence[recSequence.length - 1].delta = quantizedDeltaToStart
                        document.getElementById('json-notes').value = JSON.stringify(recSequence, null, 2)
                }
            }
        }
        function record(eventType, note) {
            if (!recording)
                return
            let time = Date.now() / 1000
            if (recSequence.length > 0) {
                const timeDelta = time - recTimeOffset
                const timeDeltaSamples = Math.round(48000 * timeDelta)
                recSequence[recSequence.length - 1].delta = timeDeltaSamples
            }
            recTimeOffset = time
            recSequence.push({note, type: eventType, delta: 0})
        } 
        init()
    </script>
</body>

</html>
