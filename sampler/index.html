<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        /* AI generated slightly nicer styles than browser's defaults */
        /* Global Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #2b2b2f;
            /* Softer, lighter dark tone to prevent eye strain */
            color: #d1d1d6;
            /* Muted off-white text to lower harsh contrast */
            padding: 2.5rem;
            max-width: 1000px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Headings */
        h1 {
            font-size: 1.25rem;
            color: #ffffff;
            margin: 1.5rem 0 1rem 0;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Style the top MIDI Setup Box */
        #midiSetupDiv {
            background-color: #323236;
            /* Slightly lighter container layer */
            padding: 1.5rem;
            border-radius: 6px;
            border: 1px solid #3d3d42;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #bcbcc2;
        }

        /* Specific elements inside the Setup Box */
        #midiSetupDiv h1 {
            margin-top: 0;
            font-size: 1.15rem;
        }

        #midiSetupDiv select {
            margin: 0 0.75rem;
            width: auto;
            display: inline-block;
        }

        /* Dropdown Select Menus */
        select {
            background-color: #222225;
            /* Deeper contrast block for clarity */
            color: #e5e5ea;
            border: 1px solid #48484a;
            border-radius: 4px;
            padding: 0.55rem 0.85rem;
            font-size: 0.95rem;
            cursor: pointer;
        }

        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: #5e5ce6;
            /* Calm purple indicator */
        }

        /* Channel Dropdown (Directly in body) */
        #midi-channel {
            margin-bottom: 2rem;
            min-width: 120px;
        }

        /* General Text Inputs (Like the Semitones input box) */
        input[type="text"],
        input:not([type]) {
            background-color: #222225;
            color: #ffffff;
            border: 1px solid #48484a;
            border-radius: 4px;
            padding: 0.45rem 0.75rem;
            font-size: 0.95rem;
            width: 500px;
            margin-left: 0.5rem;
            margin-right: 1.5rem;
        }

        /* Horizontal Divider */
        hr {
            border: 0;
            height: 1px;
            background-color: #3a3a3c;
            margin: 2rem 0;
        }

        /* System Buttons */
        button {
            background-color: #424248;
            color: #ffffff;
            border: 1px solid #48484a;
            border-radius: 4px;
            padding: 0.55rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        button:hover {
            background-color: #4c4c52;
        }

        /* Bottom Main Action Button */
        button[onclick="sendSequence()"] {
            background-color: #34c759;
            /* Softer, desaturated green */
            color: #121214;
            /* Dark text color for maximum visibility */
            border: none;
            font-weight: 600;
            /* Stronger font weight to make text pop */
            padding: 0.75rem 2rem;
            font-size: 0.95rem;
        }

        button[onclick="sendSequence()"]:hover {
            background-color: #30db5b;
        }

        pre {
            border: solid black 3px;
            padding: 12px;
        }

        #dropZone {
            border: 2px dashed #48484a;
            border-radius: 6px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            color: #bcbcc2;
            margin-bottom: 1.5rem;
        }

        #dropZone.dragover {
            border-color: #5e5ce6;
            background-color: #323236;
        }

        #wavOptions label {
            display: inline-block;
            margin: 0 1.5rem 1rem 0;
        }

        #wavOptions input {
            width: 120px;
        }

        #sampleRateHint.clickable {
            color: #5e5ce6;
            text-decoration: underline;
            cursor: pointer;
        }

        #fileInfo {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 6px;
            border: 1px solid #3d3d42;
            border-left: 4px solid #48484a;
            background-color: #323236;
            color: #8e8e93;
        }

        #fileInfo.loaded {
            border-left-color: #34c759;
            color: #d1d1d6;
        }

        #fileInfo.error {
            border-left-color: #ff453a;
            color: #ff6961;
        }

        #fileInfo .fileName {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        #fileInfo dl {
            display: grid;
            grid-template-columns: max-content auto;
            gap: 0.25rem 1.5rem;
            margin: 0;
        }

        #fileInfo dt {
            color: #8e8e93;
        }

        #fileInfo dd {
            margin: 0;
        }

        #waveformDisplay {
            background-color: dimgray;
            width: 100%;
        }
    </style>
    <title>Sampler editor</title>
</head>

<body>
    <div id="midiSetupDiv">
        <h1>MIDI setup</h1>
        Output
        <select id="outputDeviceSelect"></select>
        Input
        <select id="inputDeviceSelect"></select>
        <button onclick="runMidiSetup()">Accept</button>
    </div>
    <div id="editorDiv" style="display: none;">
        <h1>MIDI channel</h1>

        <select id="midi-channel">
            <option value="0">1</option>
            <option value="1">2</option>
            <option value="2">3</option>
            <option value="3">4</option>
            <option value="4">5</option>
            <option value="5">6</option>
            <option value="6">7</option>
            <option value="7">8</option>
            <option value="8">9</option>
            <option value="9">10</option>
            <option value="10">11</option>
            <option value="11">12</option>
            <option value="12">13</option>
            <option value="13">14</option>
            <option value="14">15</option>
            <option value="15">16</option>
        </select>
        <h1>Sample</h1>
        <div id="dropZone">Drop a .wav file here, or click to choose a file</div>
        <canvas width="1000px" height="100px" id="waveformDisplay"></canvas>
        <input type="file" id="fileInput" accept=".wav" style="display: none;">
        <div id="wavOptions">
            <label>Bits
                <select id="bitsSelect">
                    <option value="8">8</option>
                    <option value="16">16</option>
                </select>
            </label>
            <label title="Note name (e.g. C4, F#3) or frequency in Hz. Leave empty to not send.">Base frequency
                <input id="baseFreqInput" placeholder="e.g. C4 or 261.6">
            </label>
            <label>Loop index
                <input id="loopIdxInput" value="30000">
                <button onclick="cutAtLoopIdx()"
                    title="Removes everything after the loop index. This is destructive: reload the file to undo.">Cut</button>
            </label>
            <label title="Resamples the loaded sample. This is destructive: reload the file to undo.">Sample rate
                <input id="sampleRateInput">
                <button onclick="resampleLoaded()">Resample</button>
                <span id="sampleRateHint"></span>
            </label>
        </div>
        <div id="fileInfo">No file loaded</div>
        <hr />
        <button onclick="sendSequence()">Send to device</button>
        <span id="sendProgress"></span>
    </div>

    <script src="midi.js"></script>
    <script src="wav2json.js"></script>

    <script>
        const devices = new MidiDeviceList()
        async function init() {
            await devices.init()
            outputDeviceSelect.innerHTML =
                devices.getOutputs().map(x => `<option value="${x.id}">${x.name}</option>`).join('')
            inputDeviceSelect.innerHTML =
                devices.getInputs().map(x => `<option value="${x.id}">${x.name}</option>`).join('')
            const defaultOutput = devices.getOutputs().find(x => x.name === 'minilogue xd 1 SOUND')
            if (defaultOutput)
                outputDeviceSelect.value = defaultOutput.id
        }
        let outputDevice
        function runMidiSetup() {
            outputDevice = devices.getDevice('output', outputDeviceSelect.value)
            inputDevice = devices.getDevice('input', inputDeviceSelect.value)
            /*inputDevice.onNoteOn = (channel, note, velocity) => record('on', note)
            inputDevice.onNoteOff = (channel, note) => record('off', note)*/
            midiSetupDiv.style.display = 'none'
            editorDiv.style.display = ''
        }
        let loadedFile = null // { name, buffer }
        let sequence = null

        function parseFreq(text) {
            text = text.trim()
            if (!text)
                return 0
            if (/^[A-G][#b]?-?\d*$/.test(text))
                return noteToFrequency(text)
            const hz = Number(text)
            if (isNaN(hz))
                throw 'invalid base frequency: ' + text
            return hz
        }

        function updateSequence() {
            sequence = null
            if (!loadedFile)
                return
            try {
                const freq = parseFreq(baseFreqInput.value)
                const loopIdx = parseInt(loopIdxInput.value, 10)
                if (isNaN(loopIdx) || loopIdx < 0 || loopIdx > 0xFFFF)
                    throw 'invalid loop index'
                const { seq, info } = wavToSequence(loadedFile.wav, {
                    bits: Number(bitsSelect.value), freq, loopIdx
                })
                sequence = seq
                const maxFrames = Number(bitsSelect.value) === 16 ? DATA_LEN / 2 : DATA_LEN
                const fitSr = Math.floor(maxFrames * info.sampleRate / info.numFrames)
                const fits = info.usedFrames >= info.numFrames
                sampleRateHint.textContent = fits ? 'fits in memory' : `fits in memory at ≤ ${fitSr} Hz`
                sampleRateHint.classList.toggle('clickable', !fits)
                sampleRateHint.onclick = fits ? null : () => sampleRateInput.value = fitSr
                showFileInfo('loaded', '✔ ' + loadedFile.name, [
                    ['Format', `${info.sampleRate} Hz, ${info.bitDepth} bit, ${info.channels} ch` +
                        (info.channels > 1 ? ' (using first channel)' : '')],
                    ['Length', `${info.numFrames} frames (${(info.numFrames / info.sampleRate).toFixed(2)} s)` +
                        (info.usedFrames < info.numFrames ? `, truncated to ${info.usedFrames} frames` : '')],
                    ['Base frequency', freq ? `${freq.toFixed(2)} Hz` : 'not sent'],
                    ['Loop index', loopIdx],
                    ['Sequence', `${seq.length} CC messages`],
                ])
            } catch (e) {
                showFileInfo('error', `${loadedFile.name}: ${e}`)
            }
        }

        function showFileInfo(state, title, rows = []) {
            fileInfo.className = state
            fileInfo.innerHTML = ''
            const titleDiv = document.createElement('div')
            titleDiv.className = 'fileName'
            titleDiv.textContent = title
            const dl = document.createElement('dl')
            for (const [key, value] of rows) {
                const dt = document.createElement('dt')
                dt.textContent = key
                const dd = document.createElement('dd')
                dd.textContent = value
                dl.append(dt, dd)
            }
            fileInfo.append(titleDiv, dl)
        }

        function getMousePos(canvas, evt) {
            var rect = canvas.getBoundingClientRect()
            return {
                x: Math.round(evt.clientX - rect.left) * canvas.width / rect.width,
                y: Math.round(evt.clientY - rect.top) * canvas.height / rect.height
            }
        }

        function displayWaveform(wav) {
            const waveformDisplay = document.getElementById('waveformDisplay')
            const ctx = waveformDisplay.getContext('2d')
            ctx.clearRect(0, 0, waveformDisplay.width, waveformDisplay.height)
            ctx.strokeStyle = 'black'
            ctx.beginPath()
            const yy = []
            let _16bitLimitX, _8bitLimitX, loopIdxX
            for (let x = 0; x < waveformDisplay.width; x++) {
                const i = Math.trunc(wav.numFrames * x / waveformDisplay.width)
                if (!_16bitLimitX && i >= 15000)
                    _16bitLimitX = x
                if (!_8bitLimitX && i >= 30000)
                    _8bitLimitX = x
                if (!loopIdxX && i >= document.getElementById('loopIdxInput').value)
                    loopIdxX = x
                yy.push(wav.get(i))
            }

            const scale = 1 / Math.max(Math.abs(Math.min(...yy)), Math.abs(Math.max(...yy)))
            for (let x = 0; x < waveformDisplay.width; x++) {
                const y = waveformDisplay.height / 2 - waveformDisplay.height / 2 * (yy[x] * scale)
                if (x === 0)
                    ctx.moveTo(x, y)
                else
                    ctx.lineTo(x, y)
            }

            ctx.stroke()
            ctx.strokeStyle = 'yellow'
            if (_16bitLimitX) {
                ctx.beginPath()
                ctx.moveTo(_16bitLimitX, 0)
                ctx.lineTo(_16bitLimitX, waveformDisplay.height)
                ctx.stroke()
            }
            if (_8bitLimitX) {
                ctx.beginPath()
                ctx.moveTo(_8bitLimitX, 0)
                ctx.lineTo(_8bitLimitX, waveformDisplay.height)
                ctx.stroke()
            }
            if (loopIdxX) {
                ctx.strokeStyle = 'blue'
                ctx.beginPath()
                ctx.moveTo(loopIdxX, 0)
                ctx.lineTo(loopIdxX, waveformDisplay.height)
                ctx.stroke()
            }
            waveformDisplay.onclick = evt => {
                const {x, y} = getMousePos(waveformDisplay, evt)
                let i = Math.trunc(wav.numFrames * x / waveformDisplay.width)

                for (let sign = Math.sign(wav.get(i)); sign === Math.sign(wav.get(i)) && i > 0; i--);
                document.getElementById('loopIdxInput').value = i
                updateSequence()
                displayWaveform(wav)
            }
        }

        // Same algorithm as srconv.c: linear interpolation when upsampling,
        // 4 cascaded one-pole lowpass filters at the target nyquist followed
        // by sample dropping when downsampling. Returns a mono wav object.
        function resampleWav(wav, targetSr) {
            const ratio = targetSr / wav.sampleRate
            const outLen = Math.trunc(ratio * wav.numFrames)
            const inc = 1 / ratio
            const out = new Float32Array(outLen)
            const at = i => wav.get(Math.min(i, wav.numFrames - 1))
            if (targetSr > wav.sampleRate) {
                let ii = 0
                for (let i = 0; i < outLen; i++) {
                    const s1 = at(Math.trunc(ii)), s2 = at(Math.trunc(ii) + 1)
                    out[i] = s1 + (s2 - s1) * (ii - Math.trunc(ii))
                    ii += inc
                }
            } else {
                const factor = 1 / (1 / (2 * Math.PI / wav.sampleRate * targetSr / 2) + 1)
                const state = [0, 0, 0, 0]
                const filtered = new Float32Array(wav.numFrames)
                for (let i = 0; i < wav.numFrames; i++) {
                    let s = wav.get(i)
                    for (let fi = 0; fi < 4; fi++)
                        s = state[fi] = factor * s + (1 - factor) * state[fi]
                    filtered[i] = s
                }
                let ii = 0
                for (let i = 0; i < outLen; i++) {
                    out[i] = filtered[Math.min(Math.trunc(ii), wav.numFrames - 1)]
                    ii += inc
                }
            }
            return { ...wav, sampleRate: targetSr, channels: 1, numFrames: outLen, get: i => out[i] }
        }

        function resampleLoaded() {
            if (!loadedFile)
                return alert('No file loaded')
            const targetSr = parseInt(sampleRateInput.value, 10)
            if (isNaN(targetSr) || targetSr < 1000 || targetSr > 0xFFFF)
                return alert('Invalid sample rate (1000 - 65535)')
            if (targetSr === loadedFile.wav.sampleRate)
                return
            loadedFile.wav = resampleWav(loadedFile.wav, targetSr)
            displayWaveform(loadedFile.wav)
            updateSequence()
        }

        function cutAtLoopIdx() {
            if (!loadedFile)
                return alert('No file loaded')
            const loopIdx = parseInt(loopIdxInput.value, 10)
            if (isNaN(loopIdx) || loopIdx < 1)
                return alert('Invalid loop index')
            if (loopIdx >= loadedFile.wav.numFrames)
                return
            loadedFile.wav = { ...loadedFile.wav, numFrames: loopIdx }
            displayWaveform(loadedFile.wav)
            updateSequence()
        }

        async function loadFile(file) {
            const buffer = await file.arrayBuffer()
            const wav = parseWav(buffer)
            loadedFile = { name: file.name, wav }
            sampleRateInput.value = wav.sampleRate
            let name = file.name.replace(/\.wav$/i, '')
            // Pick up the loop index from file names like "pad loop=1234 C4.wav"
            const loop = name.match(/loop=(\d+)/i)
            loopIdxInput.value = loop ? loop[1] : DATA_LEN
            name = name.replace(/[\s_-]*loop=\d+/i, '')
            // Base frequency from file names like "bass freq_hz=55.wav" or a note
            // from file names like "clarinet-f4.wav" or "rock organ C5.wav"
            const hz = name.match(/freq_hz=(\d+(?:\.\d+)?)/i)
            name = name.replace(/[\s_-]*freq_hz=\d+(?:\.\d+)?/i, '')
            const m = name.match(/(?:^|[\s_-])([A-Ga-g][#b]?\d)(?:_\d+)?$/)
            baseFreqInput.value = hz ? hz[1] : m ? m[1][0].toUpperCase() + m[1].slice(1) : ''
            displayWaveform(wav)
            updateSequence()
        }

        dropZone.onclick = () => fileInput.click()
        fileInput.onchange = () => fileInput.files[0] && loadFile(fileInput.files[0])
        dropZone.ondragover = e => {
            e.preventDefault()
            dropZone.classList.add('dragover')
        }
        dropZone.ondragleave = () => dropZone.classList.remove('dragover')
        dropZone.ondrop = e => {
            e.preventDefault()
            dropZone.classList.remove('dragover')
            const file = e.dataTransfer.files[0]
            if (file)
                loadFile(file).catch(x => showFileInfo('error', 'Error: ' + x))
        }
        // Don't let the browser open files dropped outside the drop zone
        window.ondragover = window.ondrop = e => e.preventDefault()
        for (const el of [bitsSelect, baseFreqInput, loopIdxInput])
            el.oninput = updateSequence

        function sendSequence() {
            if (!sequence)
                return alert('No file loaded')
            const sshapeCc = 104;
            const channel = Number(document.getElementById('midi-channel').value)
            sendProgress.innerText = 'Sending...'
            setTimeout(() => {
                for (let i = 0; i < sequence.length; i++) {
                    outputDevice.cc(sshapeCc, sequence[i], channel)
                }
                alert('sent')
                sendProgress.innerText = ''
            }, 0)
        }
        init()
    </script>
</body>

</html>
